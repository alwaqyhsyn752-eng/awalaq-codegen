name: CodeGen Node
on: { repository_dispatch: { types: [generate] } }
permissions: { contents: write }
concurrency: { group: "codegen-${{ github.event.client_payload.job_id }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.GITHUB_TOKEN }} }
      - env: { PAYLOAD: "${{ toJson(github.event.client_payload) }}" }
        run: echo "$PAYLOAD" > job.json
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node generate.mjs
      - run: |
          git config user.name "codegen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          git commit -m "codegen: ${{ github.event.client_payload.job_id }}" || echo none
          git push
