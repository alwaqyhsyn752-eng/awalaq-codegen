name: CodeGen Node
on: { repository_dispatch: { types: [generate] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { token: ${{ secrets.CROSS_REPO_PAT }} }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install PyTorch & Transformers
        run: pip install torch transformers accelerate
      - env: { PAYLOAD: "${{ toJson(github.event.client_payload) }}" }
        run: echo "$PAYLOAD" > job.json
      - run: python generate.py
      - run: |
          git config user.name "codegen-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/
          git commit -m "codegen: ${{ github.event.client_payload.job_id }}" || echo "no changes"
          git pull origin main --rebase || true
          git push
